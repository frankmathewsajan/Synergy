{% extends 'learn/layout.html' %}
{% load static %}

{% block styles %}
    <link rel="stylesheet" href="{% static 'learn/css/new.css' %}">
{% endblock %}

{% block body %}
    <div class="body-center">
        <div class="create-container">
            <div class="content">
                <h1>Create</h1>
                <form method="POST">
                    {% csrf_token %}

                    <input type="text" id="class_name" name="class_name" placeholder="Class Name" aria-label="">

                    <textarea id="description" name="description" placeholder="Enter description" aria-label=""></textarea>

                    <input type="text" id="subject" name="subject" placeholder="Enter subject" aria-label="">

                    <button type="submit" class="btn">Create</button>
                </form>
            </div>
        </div>
    </div>

    <script src="{% static 'learn/js/index.js' %}"></script>
{% endblock %}
