{% load static %}


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Roboto+Mono&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="{% static 'learn/css/paper.css' %}">
    <link rel="stylesheet" href="{% static 'learn/css/auth.css' %}">
    <script src="https://kit.fontawesome.com/97fee35bc9.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{% static 'learn/css/navbar.css' %}">
    {% block styles %}{% endblock %}
</head>
<body class="body-center">
<div class="login-container">
    {% block form %}{% endblock %}
</div>
</body>
</html>
